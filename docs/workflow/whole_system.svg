  <rect x="960" y="380" width="210" height="68" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="1065" y="408" text-anchor="middle" font-size="13" fill="#1e1e1e">DeepSeek API</text>
  <text x="1065" y="428" text-anchor="middle" font-size="12" fill="#1e1e1e">external endpoint</text>

  <line x1="165" y1="310" x2="465" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="445" y1="310" x2="540" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="725" y1="310" x2="660" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="1015" y1="310" x2="770" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="770" y1="414" x2="956" y2="414" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah2)"/>

