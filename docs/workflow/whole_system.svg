  <rect x="380" y="520" width="240" height="76" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="552" text-anchor="middle" font-size="14" fill="#1e1e1e">Answer Eval</text>
  <text x="500" y="572" text-anchor="middle" font-size="12" fill="#1e1e1e">Exact Match · F1</text>

  <rect x="670" y="520" width="240" height="76" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="790" y="552" text-anchor="middle" font-size="14" fill="#1e1e1e">Retrieval Eval</text>
  <text x="790" y="572" text-anchor="middle" font-size="12" fill="#1e1e1e">Recall@1/3/5/10</text>

  <line x1="520" y1="448" x2="192" y2="516" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="330" y1="558" x2="376" y2="558" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="620" y1="558" x2="666" y2="558" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>

  <rect x="380" y="660" width="240" height="68" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="688" text-anchor="middle" font-size="13" fill="#1e1e1e">Faithfulness Eval</text>
  <text x="500" y="708" text-anchor="middle" font-size="12" fill="#1e1e1e">post-hoc LLM judge</text>
  <line x1="500" y1="596" x2="500" y2="656" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>

  <!-- analysis + reporting -->
  <rect x="300" y="780" width="340" height="66" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="470" y="806" text-anchor="middle" font-size="13" fill="#1e1e1e">Cross-pipeline + final analysis</text>
  <text x="470" y="826" text-anchor="middle" font-size="12" fill="#1e1e1e">paired tests · error taxonomy</text>

  <rect x="720" y="780" width="260" height="66" rx="10" fill="#c3fae8" stroke="#0ca678" stroke-width="2"/>
  <text x="850" y="818" text-anchor="middle" font-size="13" fill="#1e1e1e">docs/ reports + SVG figures</text>

  <line x1="500" y1="728" x2="474" y2="776" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="640" y1="813" x2="716" y2="813" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
