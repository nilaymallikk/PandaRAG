    </marker>
  </defs>

  <text x="600" y="30" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e1e1e">Adaptive RAG Research — Whole System</text>
  <text x="600" y="54" text-anchor="middle" font-size="14" fill="#757575">HotpotQA 500 · DeepSeek-V4.1-Flash · four pipelines · shared evaluation</text>

  <!-- data + retrieval -->
  <rect x="40" y="84" width="230" height="68" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" font-size="14" fill="#1e1e1e">HotpotQA 500</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#1e1e1e">immutable · SHA-256 fixed</text>

  <rect x="330" y="84" width="290" height="68" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="475" y="112" text-anchor="middle" font-size="13" fill="#1e1e1e">Retrieval Benchmark</text>
  <text x="475" y="132" text-anchor="middle" font-size="12" fill="#1e1e1e">Dense BGE+FAISS · BM25 · Hybrid RRF</text>

  <rect x="680" y="84" width="300" height="68" rx="10" fill="#c3fae8" stroke="#0ca678" stroke-width="2"/>
  <text x="830" y="112" text-anchor="middle" font-size="13" fill="#1e1e1e">Frozen Retrieval Artifacts</text>
  <text x="830" y="132" text-anchor="middle" font-size="12" fill="#1e1e1e">dense · bm25 · hybrid (.jsonl)</text>

  <line x1="270" y1="118" x2="326" y2="118" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>
  <line x1="620" y1="118" x2="676" y2="118" stroke="#333" stroke-width="2" marker-end="url(#ah2)"/>

  <!-- four pipelines -->
  <rect x="40" y="220" width="250" height="90" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="165" y="258" text-anchor="middle" font-size="15" fill="#1e1e1e">1 · No RAG</text>
  <text x="165" y="278" text-anchor="middle" font-size="12" fill="#1e1e1e">question → DeepSeek</text>

  <rect x="320" y="220" width="250" height="90" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="445" y="258" text-anchor="middle" font-size="15" fill="#1e1e1e">2 · Standard RAG</text>
  <text x="445" y="278" text-anchor="middle" font-size="12" fill="#1e1e1e">frozen dense top-5</text>

  <rect x="600" y="220" width="250" height="90" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="725" y="258" text-anchor="middle" font-size="15" fill="#1e1e1e">3 · Hybrid RAG</text>
  <text x="725" y="278" text-anchor="middle" font-size="12" fill="#1e1e1e">frozen RRF top-5</text>

  <rect x="880" y="220" width="270" height="90" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
