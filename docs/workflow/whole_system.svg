  <text x="140" y="428" text-anchor="middle" font-size="12" fill="#1e1e1e">all frozen constants</text>

  <rect x="250" y="380" width="160" height="68" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
