<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="white"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e1e1e">Adaptive RAG — Architecture</text>
  <text x="380" y="54" text-anchor="middle" font-size="14" fill="#757575">Frozen rule-based K=3/K=5 policy · one DeepSeek call per question</text>

  <!-- main pipeline -->
  <rect x="250" y="90" width="260" height="54" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="380" y="122" text-anchor="middle" font-size="16" fill="#1e1e1e">Question (HotpotQA)</text>

  <line x1="380" y1="144" x2="380" y2="172" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="230" y="176" width="300" height="80" rx="10" fill="#c3fae8" stroke="#0ca678" stroke-width="2"/>
  <text x="380" y="200" text-anchor="middle" font-size="15" fill="#1e1e1e">Frozen Hybrid Ranking</text>
  <text x="380" y="220" text-anchor="middle" font-size="12" fill="#1e1e1e">RRF c=60 · depth 10 · top-10</text>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#1e1e1e">(loaded, never recomputed)</text>

  <line x1="380" y1="256" x2="380" y2="278" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="230" y="282" width="300" height="72" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="380" y="312" text-anchor="middle" font-size="14" fill="#1e1e1e">Complexity / Confidence Analysis</text>
  <text x="380" y="334" text-anchor="middle" font-size="12" fill="#1e1e1e">(rule-based, no LLM)</text>

  <line x1="380" y1="354" x2="380" y2="386" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="280" y="390" width="200" height="84" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="437" text-anchor="middle" font-size="15" fill="#1e1e1e">confidence ≥ 0.5 ?</text>

  <rect x="110" y="512" width="180" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="547" text-anchor="middle" font-size="15" fill="#1e1e1e">K = 3 (top-3)</text>

  <rect x="470" y="512" width="180" height="60" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="547" text-anchor="middle" font-size="15" fill="#1e1e1e">K = 5 (top-5)</text>

  <line x1="330" y1="474" x2="205" y2="508" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="235" y="492" text-anchor="middle" font-size="12" fill="#333">yes</text>
  <line x1="430" y1="474" x2="555" y2="508" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="525" y="492" text-anchor="middle" font-size="12" fill="#333">no</text>

  <line x1="200" y1="572" x2="312" y2="612" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="560" y1="572" x2="448" y2="612" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="250" y="616" width="260" height="56" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="380" y="649" text-anchor="middle" font-size="15" fill="#1e1e1e">Context: top-K documents</text>

  <line x1="380" y1="672" x2="380" y2="700" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="250" y="704" width="260" height="60" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="380" y="738" text-anchor="middle" font-size="14" fill="#1e1e1e">DeepSeek-V4.1-Flash (1 call)</text>

  <line x1="380" y1="764" x2="380" y2="796" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="250" y="800" width="260" height="54" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="832" text-anchor="middle" font-size="15" fill="#1e1e1e">Answer + result record</text>

  <!-- frozen policy panel -->
  <rect x="720" y="176" width="440" height="540" rx="10" fill="#fff3bf" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="198" font-size="15" font-weight="bold" fill="#b45309">Frozen policy (pre-registered)</text>

  <rect x="740" y="226" width="400" height="64" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="940" y="252" text-anchor="middle" font-size="14" fill="#1e1e1e">A = 1 - ((d1 + b1) - 2) / 18</text>
  <text x="940" y="272" text-anchor="middle" font-size="12" fill="#1e1e1e">source agreement (dense &amp; BM25 top-1)</text>

  <rect x="740" y="304" width="400" height="64" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="940" y="330" text-anchor="middle" font-size="13" fill="#1e1e1e">M = (s3 - s4) / W  (pool ≥ 4 else 0)</text>
  <text x="940" y="350" text-anchor="middle" font-size="12" fill="#1e1e1e">boundary margin, W = 2/61 - 2/70</text>

  <rect x="740" y="382" width="400" height="60" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="940" y="404" text-anchor="middle" font-size="13" fill="#1e1e1e">confidence = 0.5*A + 0.5*M</text>
  <text x="940" y="424" text-anchor="middle" font-size="12" fill="#1e1e1e">ordinal heuristic, NOT a probability</text>

  <rect x="740" y="456" width="400" height="52" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
  <text x="940" y="484" text-anchor="middle" font-size="14" fill="#1e1e1e">threshold = 0.5</text>

  <rect x="740" y="522" width="400" height="64" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="940" y="548" text-anchor="middle" font-size="12" fill="#1e1e1e">confidence ≥ 0.5 → K=3</text>
  <text x="940" y="566" text-anchor="middle" font-size="12" fill="#1e1e1e">confidence &lt; 0.5 → K=5 (escalate)</text>

  <rect x="740" y="600" width="400" height="92" rx="10" fill="#eebefa" stroke="#ec4899" stroke-width="2"/>
  <text x="940" y="632" text-anchor="middle" font-size="13" fill="#1e1e1e">Recorded signals</text>
  <text x="940" y="656" text-anchor="middle" font-size="12" fill="#1e1e1e">agreement, margin, confidence, final K, reason</text>

  <line x1="530" y1="318" x2="712" y2="318" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
  <text x="600" y="308" text-anchor="middle" font-size="12" fill="#b45309">policy</text>
</svg>
